<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="688" viewBox="0 0 688 523" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif" height="523" style="overflow:hidden;display:block" role="img"><title>Line chart of food-at-home CPI indexed to 2019 equals 100. Hawaii reaches 132.9 by 2025 versus 129.6 for the U.S. city average, and sits 17 percent above its own pre-pandemic trend.</title><rect x="0" y="0" width="688" height="523" fill="#fcfcfb"/><text x="24" y="34" font-size="11" font-weight="700" letter-spacing="0.09em" fill="#898781">PANEL A · COST PRESSURE</text><text font-size="15" font-weight="640" fill="#0b0b0b" letter-spacing="-0.004em" x="24" y="55">Grocery prices in Hawaiʻi outran both the mainland and their own trend</text><text font-size="12.5" fill="#52514e" x="24" y="73">Consumer Price Index, food at home, annual averages, indexed to 2019 = 100. The dashed line extends Hawaiʻi’s</text><text font-size="12.5" fill="#52514e" x="24" y="89.5">2010–2019 log-linear trend (1.82%/yr) as a counterfactual.</text><rect x="24" y="105.5" width="15" height="2" rx="1" fill="rgb(42, 120, 214)"/><text x="46" y="109.5" font-size="12" fill="#52514e">Urban Hawaiʻi</text><rect x="137.546875" y="105.5" width="15" height="2" rx="1" fill="rgb(235, 104, 52)"/><text x="159.546875" y="109.5" font-size="12" fill="#52514e">U.S. city average</text><rect x="264.015625" y="105.5" width="15" height="2" rx="1" fill="rgb(137, 135, 129)"/><text x="286.015625" y="109.5" font-size="12" fill="#52514e">Hawaiʻi 2010–2019 trend</text><g transform="translate(24,129.5)"><line x1="48" x2="562" y1="286" y2="286" stroke="#e1e0d9" stroke-width="1"/><text x="39" y="290" text-anchor="end" font-size="11" fill="#898781" font-variant-numeric="tabular-nums">90</text><line x1="48" x2="562" y1="228.12765957446808" y2="228.12765957446808" stroke="#c3c2b7" stroke-width="1"/><text x="39" y="232.12765957446808" text-anchor="end" font-size="11" fill=