<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="688" viewBox="0 0 688 369" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif" height="369" style="overflow:hidden;display:block" role="img"><title>Stacked bars of healthcare access difficulty. Below the poverty line 18 percent had difficulty before and since the fires and 30 percent only since; above the poverty line 10 and 27 percent.</title><rect x="0" y="0" width="688" height="369" fill="#fcfcfb"/><text x="24" y="34" font-size="11" font-weight="700" letter-spacing="0.09em" fill="#898781">PANEL C · HEALTHCARE ACCESS BY POVERTY LINE</text><text font-size="15" font-weight="640" fill="#0b0b0b" letter-spacing="-0.004em" x="24" y="55">Below-poverty households report more difficulty getting care — and the gap is a pre-existing</text><text font-size="15" font-weight="640" fill="#0b0b0b" letter-spacing="-0.004em" x="24" y="75">one the fires did not create</text><text font-size="12.5" fill="#52514e" x="24" y="93">“Did you have any difficulties accessing medical care or medications?” MauiWES cohort, N = 679, surveyed</text><text font-size="12.5" fill="#52514e" x="24" y="109.5">January–March 2024.</text><rect x="24" y="120.5" width="11" height="11" rx="3" fill="rgb(24, 79, 149)"/><text x="42" y="129.5" font-size="12" fill="#52514e">Difficulty before and since the fires</text><rect x="243.765625" y="120.5" width="11" height="11" rx="3" fill="rgb(57, 135, 229)"/><text x="261.765625" y="129.5" font-size="12" fill="#52514e">Difficulty only since the fires</text><rect x="428.25" y="120.5" width="11" height="11" rx="3" fill="rgb(134, 182, 239)"/><text x="446.25" y="129.5" font-size="12" fill="#52514e">No difficulty</text><g transform="translate(24,149.5)"><text x="150" y="29" text-anchor="end" font-size="12.5" fill="#0b0b0b" font-weight="640">All respondents</text><text x="150" y="43" text-anchor="end" font-size="10.5" fill="#898781" font-variant-numeric="tabular-nums">N = 679</text><g class="seg" role="img" aria-label="All respondents: Difficulty before and since the fires 13 percent"><path d="M166,14H219.76V36H166a4,4 0 0 1 -4,-4V18a4,4 0 0 1 4,-4Z" fill="#184f95"/><text x="190.88" y="29" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="600" pointer-events="none">13%</text></g><g class="seg" role="img" aria-label="All respondents: Difficulty only since the fires 28 percent"><path d="M221.76,14H346.32V36H221.76V14Z" fill="#3987e5"/><text x="284.04" y="29" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="600" pointer-events="none">28%</text></g><g class="seg" role="img" aria-label="All respondents: No difficulty 60 percent"><path d="M348.32000000000005,14H614.52a4,4 0 0 1 4,4V32a4,4 0 0 1 -4,4H348.32000000000005V14Z" fill="#86b6ef"/><text x="483.4200000000001" y="29" text-anchor="middle" font-size="11.5" fill="#0b0b0b" font-weight="600" pointer-events="none">60%</text></g><text x="150" y="77" text-anchor="end" font-size="12.5" fill="#0b0b0b" font-weight="400">Below poverty line</text><text x="150" y="91" text-anchor="end" font-size="10.5" fill="#898781" font-variant-numeric="tabular-nums">n = 183</text><g class="seg" role="img" aria-label="Below poverty line: Difficulty before and since the fires 18 percent"><path d="M166,62H242.36V84H166a4,4 0 0 1 -4,-4V66a4,4 0 0 1 4,-4Z" fill="#184f95"/><text x="202.18" y="77" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="600" pointer-events="none">18%</text></g><g class="seg" role="img" aria-label="Below poverty line: Difficulty only since the fires 30 percent"><path d="M244.36,62H377.96000000000004V84H244.36V62Z" fill="#3987e5"/><text x="311.16" y="77" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="600" pointer-events="none">30%</text></g><g class="seg" role="img" aria-label="Below poverty line: No difficulty 52 percent"><path d="M379.96,62H610a4,4 0 0 1 4,4V80a4,4 0 0 1 -4,4H379.96V62Z" fill="#86b6ef"/><text x="496.98" y="77" text-anchor="middle" font-size="11.5" fill="#0b0b0b" font-weight="600" pointer-events="none">52%</text></g><text x="150" y="125" text-anchor="end" font-size="12.5" fill="#0b0b0b" font-weight="400">At or above poverty line</text><text x="150" y="139" text-anchor="end" font-size="10.5" fill="#898781" font-variant-numeric="tabular-nums">n = 496</text><g class="seg" role="img" aria-label="At or above poverty line: Difficulty before and since the fires 10 percent"><path d="M166,110H206.2V132H166a4,4 0 0 1 -4,-4V114a4,4 0 0 1 4,-4Z" fill="#184f95"/><text x="184.1" y="125" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="600" pointer-events="none">10%</text></g><g class="seg" role="img" aria-label="At or above poverty line: Difficulty only since the fires 27 percent"><path d="M208.2,110H328.24V132H208.2V110Z" fill="#3987e5"/><text x="268.21999999999997" y="125" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="600" pointer-events="none">27%</text></g><g class="seg" role="img" aria-label="At or above poverty line: No difficulty 63 percent"><path d="M330.24,110H610a4,4 0 0 1 4,4V128a4,4 0 0 1 -4,4H330.24V110Z" fill="#86b6ef"/><text x="472.12" y="125" text-anchor="middle" font-size="11.5" fill="#0b0b0b" font-weight="600" pointer-events="none">63%</text></g><line x1="162" x2="614" y1="140" y2="140" stroke="#c3c2b7" stroke-width="1"/><text x="162" y="155" text-anchor="start" font-size="11" fill="#898781" font-variant-numeric="tabular-nums">0%</text><text x="275" y="155" text-anchor="middle" font-size="11" fill="#898781" font-variant-numeric="tabular-nums">25%</text><text x="388" y="155" text-anchor="middle" font-size="11" fill="#898781" font-variant-numeric="tabular-nums">50%</text><text x="501" y="155" text-anchor="middle" font-size="11" fill="#898781" font-variant-numeric="tabular-nums">75%</text><text x="614" y="155" text-anchor="end" font-size="11" fill="#898781" font-variant-numeric="tabular-nums">100%</text></g><text font-size="11" fill="#898781" x="24" y="329.5">Source: UHERO, Maui Wildfire Exposure Study: Community Health, Wellbeing, and Resilience, May 15, 2024. Poverty status uses</text><text font-size="11" fill="#898781" x="24" y="345">Hawaiʻi-specific federal poverty guidelines (household of two, $22,680; household of five, $40,410).</text></svg>