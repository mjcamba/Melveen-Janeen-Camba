<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="688" viewBox="0 0 688 549" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif" height="549" style="overflow:hidden;display:block" role="img"><title>Stacked bars of food security. MauiWES 19 percent very low and 28 percent low, versus 11 and 12 percent for pre-fire Maui. By race, Filipino and Hispanic or Latino respondents reach 61 percent insecure.</title><rect x="0" y="0" width="688" height="549" fill="#1a1a19"/><text x="24" y="34" font-size="11" font-weight="700" letter-spacing="0.09em" fill="#898781">PANEL D · FOOD SECURITY</text><text font-size="15" font-weight="640" fill="#ffffff" letter-spacing="-0.004em" x="24" y="55">Food insecurity in the fire-affected cohort runs at about twice the pre-fire Maui rate</text><text font-size="12.5" fill="#c3c2b7" x="24" y="73">NCHS six-item food security scale. Post-fire MauiWES cohort (N = 679, Feb 2024) against the pre-fire UHERO Rapid</text><text font-size="12.5" fill="#c3c2b7" x="24" y="89.5">Survey Maui subsample (n = 120, June 2023).</text><rect x="24" y="100.5" width="11" height="11" rx="3" fill="rgb(158, 197, 244)"/><text x="42" y="109.5" font-size="12" fill="#c3c2b7">Very low food security</text><rect x="176.953125" y="100.5" width="11" height="11" rx="3" fill="rgb(57, 135, 229)"/><text x="194.953125" y="109.5" font-size="12" fill="#c3c2b7">Low food security</text><rect x="306.421875" y="100.5" width="11" height="11" rx="3" fill="rgb(24, 79, 149)"/><text x="324.421875" y="109.5" font-size="12" fill="#c3c2b7">No problem</text><g transform="translate(24,129.5)"><text x="198" y="29" text-anchor="end" font-size="12.5" fill="#ffffff" font-weight="640">MauiWES cohort, Feb 2024</text><text x="198" y="43" text-anchor="end" font-size="10.5" fill="#898781" font-variant-numeric="tabular-nums">N = 679</text><g class="seg" role="img" aria-label="MauiWES cohort, Feb 2024: Very low food security 19 percent"><path d="M214,14H285.76V36H214a4,4 0 0 1 -4,-4V18a4,4 0 0 1 4,-4Z" fill="#9ec5f4"/><text x="247.88" y="29" text-anchor="middle" font-size="11.5" fill="#0b0b0b" font-weight="600" pointer-events="none">19%</text></g><g class="seg" role="img" aria-label="MauiWES cohort, Feb 2024: Low food security 28 percent"><path d="M287.76,14H398.88V36H287.76V14Z" fill="#3987e5"/><text x="343.32" y="29" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="600" pointer-events="none">28%</text></g><g class="seg" role="img" aria-label="MauiWES cohort, Feb 2024: No problem 52 percent"><path d="M400.88,14H605.96a4,4 0 0 1 4,4V32a4,4 0 0 1 -4,4H400.88V14Z" fill="#184f95"/><text x="505.42" y="29" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="600" pointer-events="none">52%</text></g><text x="198" y="69" text-anchor="end" font-size="12.5" fill="#ffffff" font-weight="640">All of Maui, pre-fire</text><text x="198" y="83" text-anchor="end" font-size="10.5" fill="#898781" font-variant-numeric="tabular-nums">n = 120</text><g class="seg" role="img" aria-label="All of Maui, pre-fire: Very low food security 11 percent"><path d="M214,54H253.44V76H214a4,4 0 0 1 -4,-4V58a4,4 0 0 1 4,-4Z" fill="#9ec5f4"/><text x="231.72" y="69" text-anchor="middle" font-size="11.5" fill="#0b0b0b" font-weight="600" pointer-events="none">11%</text></g><g class="seg" role="img" aria-label="All of Maui, pre-fire: Low food security 12 percent"><path d="M255.44,54H301.92V76H255.44V54Z" fill="#3987e5"/><text x="278.68" y="69" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="600" pointer-events="none">12%</text></g><g class="seg" role="img" aria-label="All of Maui, pre-fire: No problem 76 percent"><path d="M303.91999999999996,54H605.96a4,4 0 0 1 4,4V72a4,4 0 0 1 -4,4H303.91999999999996V54Z" fill="#184f95"/><text x="456.93999999999994" y="69" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="600" pointer-events="none">76%</text></g><text x="0" y="109" font-size="11" fill="#898781" font-weight="700" letter-spacing="0.08em">MAUIWES, BY RACE</text><text x="198" y="149" text-anchor="end" font-size="12.5" fill="#ffffff" font-weight="400">Filipino</text><g class="seg" role="img" aria-label="Filipino: Very low food security 14 percent"><path d="M214,134H265.56V156H214a4,4 0 0 1 -4,-4V138a4,4 0 0 1 4,-4Z" fill="#9ec5f4"/><text x="237.78" y="149" text-anchor="middle" font-size="11.5" fill="#0b0b0b" font-weight="600" pointer-events="none">14%</text></g><g class="seg" role="img" aria-label="Filipino: Low food security 47 percent"><path d="M267.56,134H455.44V156H267.56V134Z" fill="#3987e5"/><text x="361.5" y="149" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="600" pointer-events="none">47%</text></g><g class="seg" role="img" aria-label="Filipino: No problem 39 percent"><path d="M457.44,134H610a4,4 0 0 1 4,4V152a4,4 0 0 1 -4,4H457.44V134Z" fill="#184f95"/><text x="535.72" y="149" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="600" pointer-events="none">39%</text></g><text x="198" y="189" text-anchor="end" font-size="12.5" fill="#ffffff" font-weight="400">Hispanic / Latino</text><g class="seg" role="img" aria-label="Hispanic / Latino: Very low food security 24 percent"><path d="M214,174H305.96V196H214a4,4 0 0 1 -4,-4V178a4,4 0 0 1 4,-4Z" fill="#9ec5f4"/><text x="257.98" y="189" text-anchor="middle" font-size="11.5" fill="#0b0b0b" font-weight="600" pointer-events="none">24%</text></g><g class="seg" role="img" aria-label="Hispanic / Latino: Low food security 37 percent"><path d="M307.96,174H455.43999999999994V196H307.96V174Z" fill="#3987e5"/><text x="381.7" y="189" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="600" pointer-events="none">37%</text></g><g class="seg" role="img" aria-label="Hispanic / Latino: No problem 38 percent"><path d="M457.44,174H605.96a4,4 0 0 1 4,4V192a4,4 0 0 1 -4,4H457.44V174Z" fill="#184f95"/><text x="533.7" y="189" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="600" pointer-events="none">38%</text></g><text x="198" y="229" text-anchor="end" font-size="12.5" fill="#ffffff" font-weight="400">Native Hawaiian / Pacific Islander</text><g class="seg" role="img" aria-label="Native Hawaiian / Pacific Islander: Very low food security 20 percent"><path d="M214,214H289.8V236H214a4,4 0 0 1 -4,-4V218a4,4 0 0 1 4,-4Z" fill="#9ec5f4"/><text x="249.9" y="229" text-anchor="middle" font-size="11.5" fill="#0b0b0b" font-weight="600" pointer-events="none">20%</text></g><g class="seg" role="img" aria-label="Native Hawaiian / Pacific Islander: Low food security 30 percent"><path d="M291.8,214H411V236H291.8V214Z" fill="#3987e5"/><text x="351.4" y="229" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="600" pointer-events="none">30%</text></g><g class="seg" role="img" aria-label="Native Hawaiian / Pacific Islander: No problem 50 percent"><path d="M413,214H610a4,4 0 0 1 4,4V232a4,4 0 0 1 -4,4H413V214Z" fill="#184f95"/><text x="513.5" y="229" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="600" pointer-events="none">50%</text></g><text x="198" y="269" text-anchor="end" font-size="12.5" fill="#ffffff" font-weight="400">Asian</text><g class="seg" role="img" aria-label="Asian: Very low food security 13 percent"><path d="M214,254H261.52V276H214a4,4 0 0 1 -4,-4V258a4,4 0 0 1 4,-4Z" fill="#9ec5f4"/><text x="235.76" y="269" text-anchor="middle" font-size="11.5" fill="#0b0b0b" font-weight="600" pointer-events="none">13%</text></g><g class="seg" role="img" aria-label="Asian: Low food security 28 percent"><path d="M263.52,254H374.64V276H263.52V254Z" fill="#3987e5"/><text x="319.08" y="269" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="600" pointer-events="none">28%</text></g><g class="seg" role="img" aria-label="Asian: No problem 59 percent"><path d="M376.64,254H610a4,4 0 0 1 4,4V272a4,4 0 0 1 -4,4H376.64V254Z" fill="#184f95"/><text x="495.32" y="269" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="600" pointer-events="none">59%</text></g><text x="198" y="309" text-anchor="end" font-size="12.5" fill="#ffffff" font-weight="400">White</text><g class="seg" role="img" aria-label="White: Very low food security 19 percent"><path d="M214,294H285.76V316H214a4,4 0 0 1 -4,-4V298a4,4 0 0 1 4,-4Z" fill="#9ec5f4"/><text x="247.88" y="309" text-anchor="middle" font-size="11.5" fill="#0b0b0b" font-weight="600" pointer-events="none">19%</text></g><g class="seg" role="img" aria-label="White: Low food security 12 percent"><path d="M287.76,294H334.24V316H287.76V294Z" fill="#3987e5"/><text x="311" y="309" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="600" pointer-events="none">12%</text></g><g class="seg" role="img" aria-label="White: No problem 69 percent"><path d="M336.24,294H610a4,4 0 0 1 4,4V312a4,4 0 0 1 -4,4H336.24V294Z" fill="#184f95"/><text x="475.12" y="309" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="600" pointer-events="none">69%</text></g><line x1="210" x2="614" y1="324" y2="324" stroke="#383835" stroke-width="1"/><text x="210" y="339" text-anchor="start" font-size="11" fill="#898781" font-variant-numeric="tabular-nums">0%</text><text x="311" y="339" text-anchor="middle" font-size="11" fill="#898781" font-variant-numeric="tabular-nums">25%</text><text x="412" y="339" text-anchor="middle" font-size="11" fill="#898781" font-variant-numeric="tabular-nums">50%</text><text x="513" y="339" text-anchor="middle" font-size="11" fill="#898781" font-variant-numeric="tabular-nums">75%</text><text x="614" y="339" text-anchor="end" font-size="11" fill="#898781" font-variant-numeric="tabular-nums">100%</text></g><text font-size="11" fill="#898781" x="24" y="493.5">Source: UHERO MauiWES, May 2024. The published report cross-tabulates food security by race, not by poverty line — the</text><text font-size="11" fill="#898781" x="24" y="509">poverty-line cut for this item exists only in the companion MauiWES interactive dashboard, so the race stratification is shown here</text><text font-size="11" fill="#898781" x="24" y="524.5">as the available breakdown and is not a test of the income hypothesis.</text></svg>