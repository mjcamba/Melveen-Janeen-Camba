<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="688" viewBox="0 0 688 413" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif" height="413" style="overflow:hidden;display:block" role="img"><title>Column chart of poverty rates. United States 10.6 percent, Hawaii 10.0 percent, Maui County 9.2 percent, and the MauiWES fire-affected cohort 27 percent.</title><rect x="0" y="0" width="688" height="413" fill="#fcfcfb"/><text x="24" y="34" font-size="11" font-weight="700" letter-spacing="0.09em" fill="#898781">PANEL B · WHO WAS EXPOSED</text><text font-size="15" font-weight="640" fill="#0b0b0b" letter-spacing="-0.004em" x="24" y="55">The fires struck a population about three times as likely to be below the poverty line as Maui</text><text font-size="15" font-weight="640" fill="#0b0b0b" letter-spacing="-0.004em" x="24" y="75">County overall</text><text font-size="12.5" fill="#52514e" x="24" y="93">Share of people below the federal poverty line. The three benchmarks are Census ACS estimates for the general</text><text font-size="12.5" fill="#52514e" x="24" y="109.5">population; the cohort bar is the MauiWES fire-affected sample. Maui County is a low-poverty county by national</text><text font-size="12.5" fill="#52514e" x="24" y="126">standards — which makes the contrast with the burn-zone cohort sharper, not weaker.</text><g transform="translate(24,146)"><line x1="16" x2="624" y1="150" y2="150" stroke="#c3c2b7" stroke-width="1"/><text x="16" y="145" font-size="10.5" fill="#898781" font-variant-numeric="tabular-nums">0%</text><line x1="16" x2="624" y1="108.75" y2="108.75" stroke="#e1e0d9" stroke-width="1"/><text x="16" y="103.75" font-size="10.5" fill="#898781" font-variant-numeric="tabular-nums">10%</text><line x1="16" x2="624" y1="67.5" y2="67.5" stroke="#e1e0d9" stroke-width="1"/><text x="16" y="62.5" font-size="10.5" fill="#898781" font-variant-numeric="tabular-nums">20%</text><line x1="16" x2="624" y1="26.25" y2="26.25" stroke="#e1e0d9" stroke-width="1"/><text x="16" y="21.25" font-size="10.5" fill="#898781" font-variant-numeric="tabular-nums">30%</text><g class="seg" role="img" aria-label="United States: 10.6 percent below the poverty line"><path d="M68,106.275H116a4,4 0 0 1 4,4V146a4,4 0 0 1 -4,4H68a4,4 0 0 1 -4,-4V110.275a4,4 0 0 1 4,-4Z" fill="#898781" opacity="0.55"/><text x="92" y="99.275" text-anchor="middle" font-size="14" font-weight="660" fill="#0b0b0b">10.6%</text><text x="92" y="167" text-anchor="middle" font-size="12" fill="#0b0b0b" font-weight="400">United States</text><text x="92" y="181" text-anchor="middle" font-size="10.5" fill="#898781">2024</text></g><g class="seg" role="img" aria-label="Hawaiʻi: 10.0 percent below the poverty line"><path d="M220,108.75H268a4,4 0 0 1 4,4V146a4,4 0 0 1 -4,4H220a4,4 0 0 1 -4,-4V112.75a4,4 0 0 1 4,-4Z" fill="#898781" opacity="0.55"/><text x="244" y="101.75" text-anchor="middle" font-size="14" font-weight="660" fill="#0b0b0b">10.0%</text><text x="244" y="167" text-anchor="middle" font-size="12" fill="#0b0b0b" font-weight="400">Hawaiʻi</text><text x="244" y="181" text-anchor="middle" font-size="10.5" fill="#898781">2024</text></g><g class="seg" role="img" aria-label="Maui County: 9.2 percent below the poverty line"><path d="M372,112.05000000000001H420a4,4 0 0 1 4,4V146a4,4 0 0 1 -4,4H372a4,4 0 0 1 -4,-4V116.05000000000001a4,4 0 0 1 4,-4Z" fill="#898781" opacity="0.55"/><text x="396" y="105.05000000000001" text-anchor="middle" font-size="14" font-weight="660" fill="#0b0b0b">9.2%</text><text x="396" y="167" text-anchor="middle" font-size="12" fill="#0b0b0b" font-weight="400">Maui County</text><text x="396" y="181" text-anchor="middle" font-size="10.5" fill="#898781">2020–2024</text></g><g class="seg" role="img" aria-label="MauiWES cohort: 27.0 percent below the poverty line"><path d="M524,38.625H572a4,4 0 0 1 4,4V146a4,4 0 0 1 -4,4H524a4,4 0 0 1 -4,-4V42.625a4,4 0 0 1 4,-4Z" fill="#2a78d6" opacity="1"/><line x1="548" x2="548" y1="52.650000000000006" y2="25.012500000000017" stroke="#0b0b0b" stroke-width="1.5" opacity="0.7"/><line x1="541" x2="555" y1="52.650000000000006" y2="52.650000000000006" stroke="#0b0b0b" stroke-width="1.5" opacity="0.7"/><line x1="541" x2="555" y1="25.012500000000017" y2="25.012500000000017" stroke="#0b0b0b" stroke-width="1.5" opacity="0.7"/><text x="548" y="22.625" text-anchor="middle" font-size="14" font-weight="660" fill="#0b0b0b">27%</text><text x="548" y="167" text-anchor="middle" font-size="12" fill="#0b0b0b" font-weight="640">MauiWES cohort</text><text x="548" y="181" text-anchor="middle" font-size="10.5" fill="#898781">fire-affected</text></g></g><text font-size="11" fill="#898781" x="24" y="358">Sources: U.S. Census Bureau ACS via USAFacts — Maui County 9.2% (2020–2024 5-year estimate), Hawaiʻi 10.0% and United States</text><text font-size="11" fill="#898781" x="24" y="373.5">10.6% (2024) · UHERO MauiWES, May 2024 (N = 679, surveyed Jan–Mar 2024), Hawaiʻi-specific federal poverty guidelines.</text><text font-size="11" fill="#898781" x="24" y="389">One-sample z vs. the county rate: z = 16.0, p &lt; 0.0001; cohort 95% CI [23.6%, 30.3%].</text></svg>